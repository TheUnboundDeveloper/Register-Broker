# Register Broker - automatic release on version bump
#
# Fires on every push to main. Reads BrokerSensorBridge's <Version>; if no matching
# vX.Y.Z tag exists yet (i.e. the version was just bumped), it runs the selftest gate,
# creates and pushes an annotated tag, and opens a DRAFT GitHub release with generated
# notes. If the tag already exists the run is a no-op, so ordinary pushes do nothing.
#
# To cut a release: bump <Version> in BrokerSensorBridge/BrokerSensorBridge.csproj, add a
# CHANGELOG entry, and push to main. (workflow_dispatch is also available for a manual run.)
#
# PACKAGING: the installer (MSI + bundle EXE) is BUILT on every release, so a release can
# never silently ship broken packaging - but it is ATTACHED only when the package contains a
# PRODUCTION-signed kernel driver (EV + attestation). A test-signed .sys - or a bridge that
# requires one - must not be distributed; shipping it would be worse than shipping none.
#
# The decision is read back out of the built MSI's DRIVERSIGNSTATE property rather than
# assumed, so it is the package itself that decides. Hosted runners have no WDK and hence no
# driver, so today this always resolves to "unsigned" and nothing is attached. Once an
# attested driver is available to this workflow the same condition flips on its own, with no
# edit here. See installer/README.md.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag + draft release on version bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content BrokerSensorBridge/BrokerSensorBridge.csproj
          $v = @($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $v) { throw "Could not read <Version> from BrokerSensorBridge.csproj." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "Detected version $v (tag v$v)"

      - name: Skip if the tag already exists
        id: check
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if (git tag -l $tag) {
            Write-Host "$tag already exists - nothing to release."
            "new=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "$tag is new - releasing."
            "new=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.new == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Selftest gate (build bridge, run --selftest)
        if: steps.check.outputs.new == 'true'
        shell: pwsh
        run: |
          dotnet publish BrokerSensorBridge/BrokerSensorBridge.csproj -c Release -o stage/BrokerSensorBridge
          cmd /c "stage\BrokerSensorBridge\BrokerSensorBridge.exe --selftest > selftest.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          if ($code -ne 0) { throw "Selftest FAILED (exit $code) - refusing to release." }

      - name: Build the installer (MSI + bundle) and run the packaging gates
        if: steps.check.outputs.new == 'true'
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1
          .\scripts\Test-Installer.ps1

      - name: Decide whether the package may be attached
        id: pkg
        if: steps.check.outputs.new == 'true'
        shell: pwsh
        # Ask the built package what driver it actually contains. Only a driver signed by
        # Microsoft's attestation service ("production") may be distributed.
        run: |
          $msi = Get-ChildItem dist -Filter '*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($msi.FullName,0))
          $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT `Value` FROM `Property` WHERE `Property`=''DRIVERSIGNSTATE'''))
          [void]$view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
          $rec = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
          $state = if ($rec) { $rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,1) } else { 'unknown' }
          Write-Host "Packaged driver signature state: $state"
          # Multi-line step outputs need the delimiter form; a bare newline in a
          # "name=value" line is rejected.
          "files<<RBEOF" >> $env:GITHUB_OUTPUT
          if ($state -eq 'production') {
            Write-Host "Production-signed driver - attaching the installer to the release."
            Get-ChildItem dist -Include *.msi,*.exe -Recurse | ForEach-Object { "dist/$($_.Name)" >> $env:GITHUB_OUTPUT }
          } else {
            Write-Host "Driver is '$state', not production-signed - NOT attaching any binaries (packaging gate)."
          }
          "RBEOF" >> $env:GITHUB_OUTPUT

      - name: Create and push annotated tag
        if: steps.check.outputs.new == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Register Broker ${{ steps.ver.outputs.tag }} (auto)"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Draft GitHub release (binaries only if production-signed - see header)
        if: steps.check.outputs.new == 'true'
        # Pinned to a full commit SHA (immutable) instead of the mutable @v3 tag, so a retag or
        # compromise of this third-party action can't inject code into the release pipeline
        # (CodeQL actions/unpinned-tag). The trailing comment keeps it readable + Dependabot-updatable.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          generate_release_notes: true
          # Empty when the packaged driver is not production-signed, which attaches nothing.
          files: ${{ steps.pkg.outputs.files }}
          fail_on_unmatched_files: false
          body: |
            See `CHANGELOG.md` for what changed in this release.

            Binaries are attached only when the installer was built with a **production-signed**
            kernel driver (EV + Microsoft attestation). Until that lands, the driver must be
            built and signed on the target machine per `docs/TESTING.md` /
            `docs/SIGNING-AND-DEPLOYMENT.md`; the installer itself is built and gated on every
            release, it is simply not published. See `installer/README.md`.
