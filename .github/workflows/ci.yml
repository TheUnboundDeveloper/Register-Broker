# Register Broker — CI
#
# What runs here and why:
#   * bridge        — publish the .NET broker exactly as a contributor would, then run
#                     `--selftest`. The selftest is hardware-free by design (MockSmbusBackend):
#                     calibration regression, chipset/registry gates, auth + scope + rate-limit
#                     cases all run on a bare runner.
#   * ps51-parse    — every .ps1 must parse under Windows PowerShell 5.1 (project rule:
#                     scripts support 5.1; GitHub's `powershell` shell IS 5.1).
#   * installer     — build the MSI + bundle and run the packaging gates. Worth the few
#                     minutes because the failure modes it covers are all SILENT: an
#                     unreferenced WiX fragment is dropped at link time, an over-long
#                     custom-action command line is truncated rather than rejected, and a
#                     mis-sequenced action still installs — it just does nothing useful.
#                     Runners have no WDK and therefore no driver binary, so the package
#                     builds with an empty driver feature and DRIVERSIGNSTATE=unsigned;
#                     the gates assert exactly that, which also proves the signature gate
#                     refuses to pre-select a driver it cannot vouch for.
#
# Deliberately NOT here (yet):
#   * Kernel driver compile — needs the WDK (~GBs, not on hosted runners). Driver changes
#     are gated by review + the hardware validation procedure in docs/TESTING.md instead.
#     If a WDK CI job is ever added, use Build-Driver-DirectLink.ps1 (the MSBuild route
#     needs the WDK VS extension and fails with MSB8020).

name: CI

# Least-privilege GITHUB_TOKEN. Both jobs only READ the repo — a hardware-free publish+selftest
# and a PowerShell parse check; actions/upload-artifact@v7 needs no contents:write. This top-level
# block applies to every job and closes the CodeQL actions/missing-workflow-permissions findings.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge:
    name: Bridge build + selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish bridge (Release, default flags — no DevProbes)
        run: dotnet publish BrokerSensorBridge/BrokerSensorBridge.csproj -c Release -o ci-publish

      - name: Run broker selftest
        shell: pwsh
        # The bridge is a WinExe (no console): redirect through cmd or the output is lost.
        run: |
          cmd /c "ci-publish\BrokerSensorBridge.exe --selftest > selftest.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          if ($code -ne 0) { throw "Selftest FAILED (exit $code) - see log above." }

      - name: Guard - DevProbes must never be in a default build
        shell: pwsh
        run: |
          if (Select-String -Path selftest.txt -Pattern 'DEV BUILD' -Quiet) {
            throw "Default build contains the DEV BUILD banner - the DevProbes gate is broken."
          }

      - name: Upload selftest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-log
          path: selftest.txt
          if-no-files-found: ignore

  installer:
    name: Installer build + packaging gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # No -EvThumbprint: CI has no signing material, and the artifacts produced
      # here are never distributed. WixToolset.Sdk restores through dotnet build,
      # so there is no toolset to install.
      - name: Build the MSI + bundle
        shell: pwsh
        run: .\scripts\Build-Installer.ps1

      # The runner has no driver, so the package must come out "unsigned" with the
      # kernel feature off by default. Asserting the expected state (rather than
      # whatever it happens to be) is what makes this a gate.
      - name: Packaging gates
        shell: pwsh
        run: .\scripts\Test-Installer.ps1 -ExpectSignState unsigned

      # Deliberately NOT uploading the package as an artifact. It carries no driver
      # and so cannot touch hardware, but the project's packaging gate is that no
      # installable build leaves this repo until the kernel driver is production-signed
      # (EV + attestation). Building it here proves packaging works; publishing it is a
      # separate decision. See installer/README.md and .github/workflows/release.yml.

  ps51-parse:
    name: PowerShell 5.1 parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Parse every .ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad += "$($_.FullName):$($errors[0].Extent.StartLineNumber) $($errors[0].Message)"
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "PARSE ERROR  $_" }
            throw "$($bad.Count) script(s) do not parse under Windows PowerShell 5.1."
          }
          Write-Host "All scripts parse under 5.1."
